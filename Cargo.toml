[workspace]
members = ["lez-faucet-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
cbindgen = "0.29"
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "399793b4f99b836e40694cea34fa02790912e18e" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "399793b4f99b836e40694cea34fa02790912e18e" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "399793b4f99b836e40694cea34fa02790912e18e", features = ["artifacts"] }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "399793b4f99b836e40694cea34fa02790912e18e", features = ["client"] }
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "399793b4f99b836e40694cea34fa02790912e18e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = "1"
