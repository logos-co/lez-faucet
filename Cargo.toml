[workspace]
members = ["lez-faucet-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
cbindgen = "0.29"
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "d6e4ae694e7419f5906b340c232704466a1917b7" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "d6e4ae694e7419f5906b340c232704466a1917b7" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "d6e4ae694e7419f5906b340c232704466a1917b7", features = ["artifacts"] }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "d6e4ae694e7419f5906b340c232704466a1917b7", features = ["client"] }
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "d6e4ae694e7419f5906b340c232704466a1917b7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
zeroize = "1"
