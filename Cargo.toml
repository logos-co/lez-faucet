[workspace]
members = ["lez-faucet-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
cbindgen = "0.29"
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a", features = ["artifacts"] }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a", features = ["client"] }
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
