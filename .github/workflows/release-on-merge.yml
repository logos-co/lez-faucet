name: Release on merge

# Publishes both faucet modules once `main` is green and a declared version has
# no complete release yet, so a released fix reaches the Basecamp catalog
# without anyone remembering to dispatch a workflow.
#
# The trigger is CI going green on `main`, and the decision to publish is made
# by asking GitHub what is already released. That is deliberately a *state*
# question, not an *event* one, and both halves matter:
#
#     main is green and 0.3.2 has no release  ->  publish 0.3.2
#     main is green and 0.3.2 is fully released  ->  gate exits, nothing runs
#     main is red                                ->  nothing runs at all
#
# This replaces a `push:` trigger with `paths:` on the two metadata.json files.
# That version-bump-as-event design had two holes, and 0.3.2 fell through both
# on 2026-08-19:
#
#   1. It fired the moment the bump merged, in parallel with the CI that
#      validates the build. A merge taken before the nix legs finished started
#      publishing a build nobody had built yet. 0.3.2 merged carrying a stale
#      vendor hash; the release job failed on it three variants deep.
#   2. Recovery did not re-trigger. The follow-up fix touched flake.nix and no
#      version file, so the filter did not match and the release never
#      re-attempted. The bump had been spent on the attempt that failed, and
#      0.3.2 sat unpublished with `main` green and correct until someone
#      dispatched the release by hand. Nothing surfaced that gap.
#
# Both holes close here: nothing publishes before CI is green, and every later
# green run re-asks the question, so a failed release heals itself on the next
# merge instead of waiting for a human to notice.
#
# Cost of asking on every green run rather than only on version bumps: one
# `gate` job, a few seconds, no checkout of the release machinery and no
# `rebuild-index` dispatch on the overwhelmingly common "nothing to do" path.
# The gate exists precisely so that this trigger can be broad and still cheap —
# calling the shared reusable workflow unconditionally would instead cost two
# `setup` jobs and two `rebuild-index` dispatches per merge, each of which
# re-downloads and verifies every .lgx in the repo. That is the cost the old
# `paths:` filter was avoiding, and the gate avoids it without the holes.
#
# No release loop is possible. The chain's only push is
# `git push -f origin refs/tags/<tag>` to re-point the release tag, and a tag
# ref cannot start a `workflow_run` of CI, which triggers on branches. (Nor
# would a GITHUB_TOKEN-authored push start a workflow — but that rule would
# stop protecting us the day a PAT gets introduced for signing, so the
# tag-vs-branch distinction is the durable reason.) The `already published`
# gate is the backstop regardless: a loop would exit there on its second pass.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One group across every workflow in this repo that can publish a release, so a
# manual dispatch of release-lez-faucet.yml cannot race a merge run and have two
# jobs write the same tag, upload the same assets, and force-push the same ref.
# Not scoped to github.ref: a dispatch runs on a different ref and still must not
# overlap. cancel-in-progress is false because cancelling mid-publish is exactly
# how a release ends up with a .lgx but no sidecar.json.
#
# Caveat worth knowing: GitHub keeps at most one *pending* run per group, so
# three green runs queued inside one release cycle would silently drop the
# middle one. That is now harmless rather than merely unlikely — a dropped run
# only skips one re-ask of a question the next green run asks again.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Decides whether there is anything to publish, and refuses to publish a
  # skewed pair. Everything expensive hangs off this job's outputs.
  gate:
    # `workflow_run` fires on completion, success or not. Releasing off a red
    # main is the first hole this workflow exists to close, so check it first.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      core_needed: ${{ steps.check.outputs.core_needed }}
      ui_needed: ${{ steps.check.outputs.ui_needed }}
    steps:
      # Pin to the commit CI actually validated. A `workflow_run` job otherwise
      # checks out the default branch's tip, which may already have moved past
      # the run that triggered it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # CHANGELOG.md: "lez_faucet and lez_faucet_ui are released together at the
      # same number." Enforced here because the two release calls below only
      # *order* the modules — they do not pair them. Publishing one alone would
      # let the other skip as already-published and exit green, leaving the pair
      # skewed. docs/releasing.md describes that skew as install-breaking: a
      # 0.3.x UI calls slots a 0.2.x core does not implement.
      - name: Both modules must declare the same version, and may need releasing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          core=$(jq -er .version faucet-module/metadata.json)
          ui=$(jq -er .version faucet-ui/metadata.json)
          echo "lez_faucet=$core lez_faucet_ui=$ui"
          if [[ "$core" != "$ui" ]]; then
            echo "::error::version skew — lez_faucet is $core but lez_faucet_ui is $ui. Release them together (CHANGELOG.md)."
            exit 1
          fi
          echo "version=$core" >> "$GITHUB_OUTPUT"

          # "Published" means the same thing here as in the shared release
          # action: the tag exists AND carries both a .lgx and a sidecar.json.
          # A release missing either is a partial publish and must be redone,
          # which is exactly the state a failed release job leaves behind.
          needs_release() {
            local tag="$1" assets
            assets=$(gh api "repos/$REPO/releases/tags/$tag" --jq '[.assets[].name]' 2>/dev/null) || {
              echo "  $tag: no release" >&2
              echo true
              return
            }
            if jq -e 'any(.[]; endswith(".lgx")) and any(.[]; . == "sidecar.json")' <<<"$assets" >/dev/null; then
              echo "  $tag: published" >&2
              echo false
            else
              echo "  $tag: partial ($assets)" >&2
              echo true
            fi
          }

          core_needed=$(needs_release "lez_faucet-v$core")
          ui_needed=$(needs_release "lez_faucet_ui-v$ui")
          echo "core_needed=$core_needed" >> "$GITHUB_OUTPUT"
          echo "ui_needed=$ui_needed" >> "$GITHUB_OUTPUT"

          {
            echo "### Release gate"
            echo
            echo "- version: \`$core\` (both modules)"
            echo "- \`lez_faucet\` needs releasing: \`$core_needed\`"
            echo "- \`lez_faucet_ui\` needs releasing: \`$ui_needed\`"
            echo
            if [[ "$core_needed" == "false" && "$ui_needed" == "false" ]]; then
              echo "Nothing to do — this version is fully published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # docs/releasing.md: "Release the core package before the UI package", because
  # faucet-ui/metadata.json declares a dependency on lez_faucet that Basecamp
  # resolves from the catalog index. `needs:` guarantees core's *release* is
  # published before ui builds; it does not guarantee core is in the index
  # first, since rebuild-index runs asynchronously off a repository_dispatch.
  # The index converges anyway because each rebuild rescans every release.
  core:
    needs: gate
    if: needs.gate.outputs.core_needed == 'true'
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: faucet-module
      # No `variants` override, for the reason release-lez-faucet.yml gives:
      # faucet-module/flake.nix is the single source of truth for what is
      # buildable, and restating the list here would only let the two drift.

  ui:
    # `always()` so the UI still publishes when core was *skipped* as already
    # published — the healing case where a previous run got core out and then
    # failed on the UI. Without it, `needs:` would treat that skip as a reason
    # to skip the UI too, and the pair would stay half-released forever.
    #
    # A core that actually *failed* must still block the UI: publishing a UI
    # against a core that failed to publish is the worse outcome, and is the
    # trade release-on-merge has always made.
    needs: [gate, core]
    if: >-
      always()
      && needs.gate.outputs.ui_needed == 'true'
      && (needs.core.result == 'success' || needs.core.result == 'skipped')
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: faucet-ui
      # No `variants` override — see core above.
