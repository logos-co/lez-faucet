name: Rebuild catalog index

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: lez-faucet-catalog-index
  cancel-in-progress: true

jobs:
  rebuild:
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/rebuild-index.yml@v1
