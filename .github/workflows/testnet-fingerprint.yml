# Watches the LEZ legacy testnet for a protocol upgrade.
#
# Builtin program ImageIDs are computed client-side from ELFs embedded at build
# time, so when the testnet upgrades, every already-shipped build starts failing
# every claim with `program_fingerprint_mismatch` — "This app does not match the
# deployed testnet". Nothing in this repository changes at that moment, so no
# ordinary check goes red; the 2026-08-05 upgrade went unnoticed for four days
# and was reported by a user looking at the banner.
#
# The target moved on 2026-10-21. The main testnet (testnet.lez.logos.co) went
# to LEZ v0.3.x, which has no pinata program, so this watchdog — and the app —
# now point at testnet-legacy.lez.logos.co, which still runs v0.2.4-lez-legacy.
# The sequencer URL comes from the network table in lez-faucet-ffi/src/network.rs
# (compiled check) and the default in scripts/check-program-fingerprint.sh
# (advisory check); the two must agree, and docs/testnet.md names them both.
#
# Since 0.5.0 the app also claims on the v0.3 testnet, through a hosted claim
# service. That network has no compiled program to compare, so its job below
# (`v03`) checks two different things: that the sequencer's
# `privacy_preserving_circuit` ImageID still matches the value recorded in
# docs/testnet.md (the same value the network row carries), and that the claim
# service answers `GET /v1/info`. The legacy job and its script are unchanged.
#
# This job exists to be the thing that notices instead. It runs two checks, and
# the distinction between them matters:
#
#   1. `fingerprint` (authoritative) — builds the client and runs the live test,
#      which compares the ImageIDs *compiled into this build* against the
#      sequencer's `getProgramIds`. This is the same comparison the runtime gate
#      makes, so it is the one that predicts whether a user can claim.
#
#   2. `docs-in-sync` (advisory) — runs scripts/check-program-fingerprint.sh,
#      which compares the sequencer against the table in docs/testnet.md. It
#      needs no toolchain and names the drift precisely, which makes it the
#      useful diagnostic. It cannot stand alone: the table is prose, and editing
#      it would silence the check without fixing anything.
#
# A red run means "repin to the deployed LEZ revision"; the procedure is at the
# bottom of docs/testnet.md. On failure this opens (or updates) an issue,
# because a scheduled run that nobody is watching reddens no PR and notifies no
# one — the loop would otherwise still be "a maintainer happens to look at the
# Actions tab", which is barely better than waiting for a user to report the
# banner.
#
# Deliberately its own workflow rather than a job in ci.yml: ci.yml has no
# `schedule` trigger, and giving it one would run the six-way nix build matrix
# daily and let a cron run cancel an in-flight pull-request run through its
# shared `cancel-in-progress` concurrency group.
#
# Deliberately not run on pull requests either. A testnet upgrade is not a
# defect in whatever branch happens to be open, and reddening every unrelated PR
# is how a check earns the right to be ignored.
#
# Note that GitHub disables scheduled workflows in a repository with no commits
# for 60 days. If this repo goes quiet, the watchdog stops silently.

name: Testnet fingerprint

on:
  schedule:
    # Early UTC daily, offset off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lez-faucet-testnet-fingerprint
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Compiled program IDs match the deployed testnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The LEZ crates are git dependencies that link against system OpenSSL
      # and use libclang for bindgen. Same set as ci.yml's `rust` job.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libssl-dev pkg-config

      # This action selects the toolchain by BRANCH name, so pinning the commit
      # drops that selection — `toolchain:` has to say `stable` explicitly.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The authoritative check. Read-only against the testnet: it calls
      # get_info, which runs verify_fingerprint first. The write test that
      # spends 150 LEZ is a different test and is not selected here.
      - name: Compiled ImageIDs vs deployed (authoritative)
        id: compiled
        run: |
          cargo test -p lez-faucet-ffi --test live_public_testnet \
            faucet_info_matches_the_pinned_protocol -- --ignored --exact --nocapture

      # Advisory, and always run so a red build still reports which IDs moved
      # even when the step above has already failed.
      - name: docs/testnet.md vs deployed (advisory)
        id: docs
        if: always()
        run: scripts/check-program-fingerprint.sh

      - name: Summarise
        if: always()
        shell: bash
        env:
          COMPILED: ${{ steps.compiled.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          {
            echo "### Testnet fingerprint"
            echo
            echo "- compiled ImageIDs vs deployed (authoritative): \`${COMPILED:-skipped}\`"
            echo "- docs/testnet.md vs deployed (advisory): \`${DOCS:-skipped}\`"
            echo
            if [ "$COMPILED" = "success" ] && [ "$DOCS" = "success" ]; then
              echo "This build still matches the deployed testnet."
            elif [ "$COMPILED" = "failure" ]; then
              echo "**The testnet no longer matches this build.**"
              echo
              echo "Every shipped client now refuses to claim with"
              echo "\`program_fingerprint_mismatch\`. Repin to the deployed LEZ"
              echo "revision, rebuild, rerun the live account-init/claim test, and"
              echo "only then refresh the ImageID table in \`docs/testnet.md\`."
              echo "See the procedure at the bottom of that file."
            elif [ "$DOCS" = "failure" ]; then
              echo "**\`docs/testnet.md\` is out of step with the deployed testnet**,"
              echo "even though the compiled build still matches it. That normally"
              echo "means the table was edited by hand, or a repin landed without"
              echo "updating it. Correct the document."
            else
              echo "The check did not complete — most likely a transient network or"
              echo "runner failure rather than a protocol change. See the log above;"
              echo "the script distinguishes an unreachable sequencer from drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A scheduled failure reddens no PR and notifies nobody, so say it out
      # loud. Only for a real mismatch — not for a transient network failure,
      # which would otherwise file an alarming and untrue issue every time the
      # sequencer blips.
      - name: Report drift
        if: failure() && steps.compiled.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const title = 'Testnet upgraded: this build no longer matches the deployed programs'
            const body = [
              'The daily fingerprint check failed: the ImageIDs compiled into this',
              'build no longer match what the sequencer reports.',
              '',
              'Every shipped client now refuses to claim with',
              '`program_fingerprint_mismatch` ("This app does not match the deployed',
              'testnet"). This is the fingerprint gate working as designed, not a bug.',
              '',
              'Repin to the deployed LEZ revision, rebuild, rerun the live',
              'account-init/claim test, then refresh the ImageID table in',
              '`docs/testnet.md`. The procedure is at the bottom of that file.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'testnet-drift',
            })

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['testnet-drift'],
              })
            }

  v03:
    name: v0.3 circuit ID matches docs and the claim service answers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain: the v0.3 row compiles no program. The ImageID the
      # client expects is data in lez-faucet-ffi/src/network.rs, recorded in
      # docs/testnet.md in the raw word form the sequencer reports, so the
      # comparison needs only curl and jq. The sequencer URL and the claim
      # service root are read from the network row rather than repeated here.
      - name: v0.3 privacy_preserving_circuit vs docs/testnet.md
        id: circuit
        shell: bash
        run: |
          set -euo pipefail
          row="$(sed -n '/^pub const LEZ_V03_TESTNET/,/^};/p' lez-faucet-ffi/src/network.rs)"
          sequencer="$(printf '%s\n' "$row" | sed -n 's/^ *sequencer_url: "\([^"]*\)",$/\1/p')"
          test -n "$sequencer"
          expected="$(sed -n 's/^| `privacy_preserving_circuit` (words) | `\(\[[0-9,]*\]\)` |$/\1/p' docs/testnet.md)"
          test -n "$expected" || { echo "docs/testnet.md does not record the v0.3 circuit words"; exit 1; }
          echo "expected (docs): $expected"
          deployed="$(curl -fsS --max-time 20 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getProgramIds","params":[]}' \
            "$sequencer" | jq -c '.result.privacy_preserving_circuit')"
          echo "deployed ($sequencer): $deployed"
          if [ "$deployed" != "$expected" ]; then
            echo "::error::the v0.3 testnet's privacy_preserving_circuit ImageID moved"
            exit 1
          fi

      - name: Claim service answers GET /v1/info
        id: service
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          row="$(sed -n '/^pub const LEZ_V03_TESTNET/,/^};/p' lez-faucet-ffi/src/network.rs)"
          base_url="$(printf '%s\n' "$row" | sed -n 's/^ *base_url: "\([^"]*\)",$/\1/p')"
          test -n "$base_url"
          echo "claim service: $base_url"
          curl -fsS --max-time 20 "$base_url/v1/info" | jq '{network, prize, decimals, hot_balance, claims_remaining, paused}'

      - name: Summarise
        if: always()
        shell: bash
        env:
          CIRCUIT: ${{ steps.circuit.outcome }}
          SERVICE: ${{ steps.service.outcome }}
        run: |
          {
            echo "### v0.3 testnet"
            echo
            echo "- privacy_preserving_circuit vs docs/testnet.md: \`${CIRCUIT:-skipped}\`"
            echo "- claim service GET /v1/info: \`${SERVICE:-skipped}\`"
            echo
            if [ "$CIRCUIT" = "failure" ]; then
              echo "**The v0.3 testnet's circuit ImageID no longer matches the network row.**"
              echo "Every shipped client refuses v0.3 claims with \`program_fingerprint_mismatch\`."
              echo "Update \`LEZ_V03_TESTNET.fingerprint\` in \`lez-faucet-ffi/src/network.rs\`"
              echo "and the table in \`docs/testnet.md\`, after checking what else moved."
            elif [ "$SERVICE" = "failure" ]; then
              echo "**The claim service did not answer.** v0.3 claims fail with"
              echo "\`claim_api_unavailable\` until it is back; see \`claimd/README.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report drift
        if: failure() && steps.circuit.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const title = 'v0.3 testnet upgraded: the circuit ImageID no longer matches this build'
            const body = [
              'The daily v0.3 check failed: the sequencer reports a',
              '`privacy_preserving_circuit` ImageID different from the one in',
              '`docs/testnet.md` and `LEZ_V03_TESTNET` in `lez-faucet-ffi/src/network.rs`.',
              '',
              'Every shipped client now refuses v0.3 claims with',
              '`program_fingerprint_mismatch`. Update the network row and the docs',
              'table after checking what else moved on the v0.3 testnet.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'testnet-drift',
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['testnet-drift'],
              })
            }
