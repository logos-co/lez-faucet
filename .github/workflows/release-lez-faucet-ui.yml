name: Release lez_faucet_ui

on:
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: faucet-ui
      # No `variants` override: the shared workflow already defaults to
      # darwin-arm64, linux-amd64, linux-arm64, and this module's flake builds
      # on all three. See release-lez-faucet.yml for the same reasoning.
