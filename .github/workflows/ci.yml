# Checks that run on every pull request.
#
# Until this existed, all three workflows in this directory were
# workflow_dispatch/schedule only, so a merge was unconditionally green while
# four working suites went unrun — and nothing ever built either module on
# Linux at all.
#
# The fast suites (`rust`, `ui`, `module`) answer within minutes. The `build`
# matrix is the slow one: it runs the exact `#lgx-portable` build the release
# workflow runs, for both modules, on all three release runners, so a green
# tick here is evidence about a release rather than only about the sources.
# It then inspects what came out: that the bundle carries this runner's
# variant, and that the manifest inside it still says what metadata.json says
# (scripts/check-lgx-manifest.py — the packaging tool copies those fields
# through an allowlist it maintains in another repo, and has dropped one).
#
# `linux-install-load` then takes the two Linux bundles the matrix produced
# and installs and loads them, on the architecture that built them, with the
# real package manager and the real module host. Building a package and
# running one are different claims, and until that job existed only the first
# had ever been made about Linux.
#
# What this does NOT cover, so nobody reads a green tick as more than it is:
#
#   - `lgs basecamp build`. The `build` matrix calls `nix build .#lgx-portable`
#     per module directly, which is what the release workflow does; the
#     Scaffold aggregate wrapper is not exercised here.
#   - The Basecamp GUI, on any platform. `linux-install-load` is headless: it
#     proves a module installs and loads, not that a view renders or that the
#     app works.
#   - faucet-ui/tests/smoke.mjs. Needs the Qt MCP harness from a Nix build
#     (LOGOS_QT_MCP), which is not available here.
#   - The four #[ignore]d live-testnet tests in lez-faucet-ffi. They spend real
#     testnet LEZ against a shared pool and must stay manual.
#   - Rendering FaucetView.qml in a real QML engine. qml-load.test.mjs skips
#     itself without Qt and the Logos Design System; the "report skipped tests"
#     step below makes that visible instead of silently green.
#   - x86_64-darwin. Neither flake exposes it; see faucet-module/flake.nix.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The `build` matrix is expensive enough to be worth re-running by hand
  # after a runner-side failure without pushing an empty commit.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The LEZ crates are git dependencies that link against system OpenSSL
      # and use libclang for bindgen.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libssl-dev pkg-config

      # This action selects the toolchain by BRANCH name, so pinning the commit
      # drops that selection — `toolchain:` has to say `stable` explicitly.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # The live-testnet tests are #[ignore]d and stay that way: they move real
      # testnet balance against a pool shared with everyone else.
      - name: cargo test
        run: cargo test -p lez-faucet-ffi

  ui:
    name: UI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # These assert on the QML/JS state machine and on properties of the
      # sources themselves (no filesystem writes, no coerced balances, the
      # remote interface matching its locked surface).
      #
      # The reporter is pinned to tap because the next step parses this output,
      # and node's default flips between spec and tap depending on whether it
      # thinks it has a TTY. Piped, spec still emits "ℹ skipped 0" while tap
      # emits "# skipped 0", so an unpinned reporter silently reports no skips.
      - name: Unit tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap 'faucet-ui/tests/unit/*.test.mjs' \
            | tee /tmp/ui-tests.log

      # A self-skipping test is a coverage hole that looks like a pass. Surface
      # the count so a reviewer sees what did not actually run here.
      - name: Report skipped tests
        if: always()
        run: |
          skipped=$(grep -oE '^# skipped [0-9]+' /tmp/ui-tests.log | awk '{print $3}' | head -1)
          echo "Skipped on this runner: ${skipped:-unknown}"
          {
            echo '### UI unit tests'
            echo 'qml-load.test.mjs skips itself without Qt and the Logos Design System,'
            echo 'so FaucetView is not rendered on this runner.'
            echo '```'
            grep -E '^# (tests|pass|fail|skipped) ' /tmp/ui-tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  module:
    name: Core module contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compiles the core module's test harness with -Wall -Wextra -Wpedantic
      # -Werror and runs the cross-layer contract test, which pins the ABI the
      # UI is generated against.
      - name: Configure
        run: cmake -S faucet-module/tests -B faucet-module/tests/build

      - name: Build
        run: cmake --build faucet-module/tests/build

      - name: Test
        run: ctest --test-dir faucet-module/tests/build --output-on-failure

  build:
    name: ${{ matrix.module }} (${{ matrix.variant }})
    strategy:
      # One leg failing must not cancel the others. The whole point of this
      # job is a per-platform answer: "linux-arm64 fails and linux-amd64
      # passes" is the finding, and fail-fast would hide it.
      fail-fast: false
      matrix:
        # Both modules, because the variant change affects both. faucet-module
        # is the one whose flake changed; faucet-ui only lost its `variants`
        # pin, but that pin was the only thing that had ever kept its Linux
        # outputs from being asked for, so it is equally unproven.
        module: [faucet-module, faucet-ui]
        # Variant names, and the runner each maps to, are copied from the
        # shared release workflow's build matrix
        # (logos-co/logos-modules-release-action@v1, .github/workflows/release.yml)
        # so that a green CI leg means the corresponding release leg builds.
        variant: [darwin-arm64, linux-amd64, linux-arm64]
        include:
          - variant: darwin-arm64
            runs-on: macos-latest          # Apple silicon
          - variant: linux-amd64
            runs-on: ubuntu-latest         # x86_64
          - variant: linux-arm64
            runs-on: ubuntu-24.04-arm      # Public GitHub arm64 runner
    runs-on: ${{ matrix.runs-on }}
    # Well under the 6h GitHub default, and deliberately so. There is no
    # binary cache for this stack beyond cache.nixos.org, so a cold runner can
    # compile the LEZ client, risc0 and Qt from source; 90 minutes is a
    # generous ceiling for that on a 4-core runner while still failing inside
    # a useful feedback window. A job that burns six hours and then dies tells
    # us less, later, than one that dies at ninety minutes. Revisit once a
    # green build gives real numbers — this ceiling is a judgement call, not a
    # measurement.
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 matches the release workflow. Nix resolves `.` inside a
      # git worktree to `git+file://…?dir=<module>`, and flake inputs that
      # reference the working tree (this repo's `faucet-source = path:..`)
      # are unhappy with a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Same installer, same pinned SHA, same extra-conf as the shared release
      # workflow. Matching it is the point: CI is only evidence about releases
      # if it installs Nix the way releases do.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: nix build .#lgx-portable
        id: build
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail
          # The same attribute the release workflow builds: the portable
          # bundle, not the dev one. `--print-build-logs` is the only
          # deviation — without it Nix collapses builder output to a progress
          # line, and a CI job whose failure text is "builder failed" is not
          # worth running.
          nix build .#lgx-portable --no-link --print-out-paths --print-build-logs > .lgx-out
          out=$(cat .lgx-out)
          lgx=$(find "$out" -maxdepth 2 -name '*.lgx' | head -n1)
          if [[ -z "$lgx" ]]; then echo "::error::nix build produced no .lgx"; exit 1; fi
          echo "built $(basename "$lgx") ($(du -h "$lgx" | cut -f1)) for ${{ matrix.variant }}"
          # Which variant directory the bundle actually carries, and a hard
          # check that it is the one this runner is supposed to produce. A
          # build that succeeds on a Linux runner but packages darwin-arm64
          # would otherwise pass silently — and "the flake builds on Linux" is
          # exactly the claim under test, so it is worth asserting rather than
          # printing. A .lgx is a gzipped tar (nix-bundle-lgx/bundle.sh writes
          # it with `tarfile.open(..., 'w:gz')`).
          # `[^/]+`, not `[^/]*`: the tar carries a bare `variants/` directory
          # entry alongside `variants/<name>/…`, and `*` matches it with zero
          # characters, so the name list comes back with a leading empty line.
          got=$(tar tzf "$lgx" | grep -oE 'variants/[^/]+' | sort -u | sed 's|variants/||')
          echo "variants in bundle: ${got:-<none>}"
          if [[ "$got" != "${{ matrix.variant }}" ]]; then
            echo "::error::expected variant ${{ matrix.variant }}, bundle carries '${got:-<none>}'"
            exit 1
          fi
          echo "lgx=$lgx" >> "$GITHUB_OUTPUT"

      # The variant assertion above proves the bundle carries the right
      # *payload*. This proves it carries the right *description of itself*.
      #
      # The two stages that write a .lgx live in other repos, pinned by
      # flake.lock: `lgx create` writes the base manifest, then
      # nix-bundle-lgx's bundle.sh patches this module's fields in from
      # metadata.json — through a hand-maintained key allowlist. When the
      # pinned bundle.sh has not heard of a key, it drops it. Silently: no
      # build failure, no test failure, and an optional field that is simply
      # absent from the artifact users install.
      #
      # That already happened once, next door. logos-co/eth-lez-atomic-swaps
      # shipped swap v0.3.0 with no `display_name`, because its lock pinned
      # nix-bundle-lgx one commit before `display_name` joined the allowlist.
      # See https://github.com/logos-co/eth-lez-atomic-swaps/issues/60
      #
      # This repo's lock is one commit past that, so it is correct today —
      # by luck. This step is the part that is not luck. It runs per module
      # per variant, so a drop is caught on whichever runner it happens on.
      - name: Manifest round trip (.lgx vs metadata.json)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-lgx-manifest.py \
            '${{ steps.build.outputs.lgx }}' \
            '${{ matrix.module }}/metadata.json'

      # Hand the Linux bundles to `linux-install-load`. Only Linux, because
      # that is the only place they can be installed and loaded by a runner
      # of the matching architecture — a darwin-arm64 bundle has nowhere to
      # go here, and uploading it would only cost time.
      #
      # The .lgx sits in the Nix store, which is root-owned and read-only;
      # upload-artifact reads rather than writes, so that is fine, but the
      # file also arrives with the store's 0444 and no execute bit. Nothing
      # downstream needs one: lgpm reads the archive.
      - name: Upload the .lgx for the install/load smoke test
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lgx-${{ matrix.module }}-${{ matrix.variant }}
          path: ${{ steps.build.outputs.lgx }}
          if-no-files-found: error
          # Purely a hand-off between two jobs of the same run. Keeping these
          # for the 90-day default would retain a few hundred MB per pull
          # request for nobody.
          retention-days: 1

  # ── Does a Linux package actually install and load? ────────────────────────
  #
  # Everything above proves a .lgx can be *built* on Linux and that it
  # describes itself correctly. Neither is the claim a user makes. Until this
  # job existed, no Linux artifact this repository had ever produced had been
  # installed or loaded by anything: the app was developed and verified on
  # macOS, and the Linux variants shipped on the strength of a tar listing.
  #
  # So this takes the bundles the matrix above just built, on the same
  # architecture that built them, and puts them through the real path:
  #
  #   1. lgpm, the package manager Basecamp installs with. `lgpm install
  #      --file` is PackageManagerLib::installPluginFile behind a CLI — the
  #      same call, the same variant selection, the same on-disk layout.
  #      Untarring the bundle by hand would prove none of that.
  #   2. ldd and dlopen(RTLD_NOW): the dynamic linker's own answer, with lazy
  #      binding switched off so an unresolved symbol fails here instead of
  #      in front of a user. See scripts/dlopen-check.c.
  #   3. logoscore, the real module host. It and Basecamp are the two
  #      frontends over logos-liblogos, so `load-module` runs the same
  #      ModuleManager, the same protocol-version gate and the same
  #      QPluginLoader the desktop app runs.
  #
  # Both tools are pulled in as released binaries rather than built from
  # source. That is what a user has, and building either through Nix would
  # put a Qt compile in front of a job whose value is that it answers in
  # minutes once the matrix is done.
  #
  # What this deliberately does NOT prove:
  #
  #   - The Basecamp GUI, or any GUI. Nothing opens a window.
  #   - lez_faucet_ui as a running view. Its backend plugin is installed and
  #     dlopen'd, but a ui_qml package's view needs a QML engine and the
  #     Logos Design System, so logoscore is not asked to load it.
  #   - Any faucet behaviour. Nothing is configured and no method is called.
  #     The module spends from a finite shared testnet pool; CI has no
  #     business touching it.
  linux-install-load:
    name: Install and load (${{ matrix.variant }})
    # The whole matrix, including the darwin leg. A build failure anywhere
    # skips this job rather than letting it fail on a missing artifact, which
    # is the more readable of the two outcomes.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-amd64
            runs-on: ubuntu-latest         # x86_64
            arch: x86_64
            # `readelf -h` spelling, asserted so that a bundle built for the
            # other architecture cannot pass by being installed on a runner
            # that never tries to load it.
            elf-machine: Advanced Micro Devices X86-64
            lgpm-sha256: 41c897a6da6db0ecabe03c0098b9bd0652ea8cd2eaf091e2d646a65b71260780
            logoscore-sha256: 6f216f4b807520194dd0e4d1a3d69bd2bc83f38781a5e7b2c1abf66e40143b33
          - variant: linux-arm64
            runs-on: ubuntu-24.04-arm      # Public GitHub arm64 runner
            arch: aarch64
            elf-machine: AArch64
            lgpm-sha256: 0ffa8f33f94d11a1e27985cd8d18f9814b69c38fc2d61614d87a479f0c7ac1e2
            logoscore-sha256: 3ea4a454681c2867717c1de6f72d7d0dd25549d840e2534386c917d70602c9ee
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    env:
      # Both tools ship as AppImages and GitHub's Ubuntu images carry no
      # libfuse2, so the AppImage runtime cannot mount itself. This unpacks
      # to a temporary directory and execs from there instead.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      # Nothing here opens a window, but liblogos constructs a Qt application
      # object; offscreen keeps that from wanting an X server.
      QT_QPA_PLATFORM: offscreen
      # Pinned rather than "latest": a tool that changes under the job turns
      # this from evidence into weather. Bump deliberately, with the hashes.
      LGPM_VERSION: '0.2.1'
      LOGOSCORE_VERSION: '0.2.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate directories rather than one merged download, so that the
      # step below can name each package instead of globbing a directory and
      # hoping the right two files are in it. The .lgx basename comes from
      # the packaging tool, not from this repository, so it is not something
      # to pattern-match against.
      - name: Download the core module bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lgx-faucet-module-${{ matrix.variant }}
          path: lgx/core

      - name: Download the UI module bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lgx-faucet-ui-${{ matrix.variant }}
          path: lgx/ui

      - name: Fetch lgpm and logoscore
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 --retry-all-errors -o "$out" "$url"
            echo "$want  $out" | sha256sum -c -
          }

          fetch \
            "https://github.com/logos-co/logos-package-manager/releases/download/${LGPM_VERSION}/lgpm-${{ matrix.arch }}-linux.tar.gz" \
            '${{ matrix.lgpm-sha256 }}' "$tools/lgpm.tar.gz"
          fetch \
            "https://github.com/logos-co/logos-logoscore-cli/releases/download/${LOGOSCORE_VERSION}/logoscore-${{ matrix.arch }}-linux.tar.gz" \
            '${{ matrix.logoscore-sha256 }}' "$tools/logoscore.tar.gz"

          tar -xzf "$tools/lgpm.tar.gz" -C "$tools"
          tar -xzf "$tools/logoscore.tar.gz" -C "$tools"
          # The AppImage runtime reads its own path from /proc/self/exe, so
          # rename rather than symlink and the payload still resolves.
          mv "$tools/lgpm-${{ matrix.arch }}.AppImage" "$tools/lgpm"
          mv "$tools/logoscore-${{ matrix.arch }}.AppImage" "$tools/logoscore"
          chmod +x "$tools/lgpm" "$tools/logoscore"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Versions under test
        shell: bash
        run: |
          set -euo pipefail
          lgpm --version
          logoscore --version

      # The step that makes this an installation rather than an extraction.
      # lgpm chooses the platform variant itself: on x86_64 it asks for
      # linux-x86_64 first and falls back to linux-amd64, which is the name
      # the release matrix uses, so the fallback is the live path here.
      - name: Install both packages with lgpm
        shell: bash
        run: |
          set -euo pipefail
          modules_dir="$RUNNER_TEMP/logos/modules"
          plugins_dir="$RUNNER_TEMP/logos/ui-plugins"
          mkdir -p "$modules_dir" "$plugins_dir"
          echo "LOGOS_MODULES_DIR=$modules_dir" >> "$GITHUB_ENV"
          echo "LOGOS_UI_PLUGINS_DIR=$plugins_dir" >> "$GITHUB_ENV"

          core=$(find lgx/core -name '*.lgx' | head -n1)
          ui=$(find lgx/ui -name '*.lgx' | head -n1)
          [[ -n "$core" && -n "$ui" ]] || { echo "::error::missing .lgx input"; exit 1; }

          # Core before UI: the same order docs/community-install.md gives a
          # user, because the UI declares the core as a dependency.
          for pkg in "$core" "$ui"; do
            echo "::group::lgpm install $(basename "$pkg")"
            lgpm --modules-dir "$modules_dir" --ui-plugins-dir "$plugins_dir" \
              install --file "$pkg"
            echo "::endgroup::"
          done

          lgpm --modules-dir "$modules_dir" --ui-plugins-dir "$plugins_dir" list

      # Requirement two: the right variant was chosen, and the payload landed
      # where a loader looks — `<modules-dir>/<name>/`, which is the layout
      # liblogos scans through this same library.
      - name: Check the installed layout and variant
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          check() {
            local dir=$1 name=$2 main=$3
            echo "--- $name in $dir"
            if [[ ! -d "$dir/$name" ]]; then
              echo "::error::$name was not installed into $dir"; fail=1; return
            fi
            # lgpm writes this file with the variant it actually selected, so
            # it is the package manager's own answer rather than ours.
            local got
            got=$(cat "$dir/$name/variant" 2>/dev/null || echo '<absent>')
            echo "variant: $got"
            if [[ "$got" != '${{ matrix.variant }}' ]]; then
              echo "::error::$name installed variant '$got', expected ${{ matrix.variant }}"
              fail=1
            fi
            if [[ ! -f "$dir/$name/manifest.json" ]]; then
              echo "::error::$name has no manifest.json"; fail=1
            else
              python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print('manifest:', m.get('name'), m.get('version'), m.get('type'))" \
                "$dir/$name/manifest.json"
            fi
            if [[ ! -f "$dir/$name/$main" ]]; then
              echo "::error::$name is missing its main library $main"; fail=1; return
            fi
            local machine
            machine=$(readelf -h "$dir/$name/$main" | sed -n 's/^  Machine: *//p')
            echo "ELF machine: $machine"
            if [[ "$machine" != '${{ matrix.elf-machine }}' ]]; then
              echo "::error::$main is ${machine}, expected ${{ matrix.elf-machine }}"
              fail=1
            fi
          }

          check "$LOGOS_MODULES_DIR"    lez_faucet    lez_faucet_plugin.so
          check "$LOGOS_UI_PLUGINS_DIR" lez_faucet_ui lez_faucet_ui_plugin.so

          # The UI package is a view, so its QML entry point has to survive
          # the trip as well; the backend plugin alone is not the app.
          if [[ ! -f "$LOGOS_UI_PLUGINS_DIR/lez_faucet_ui/qml/FaucetView.qml" ]]; then
            echo "::error::lez_faucet_ui is missing qml/FaucetView.qml"
            fail=1
          fi

          exit $fail

      # `ldd` answers a question the build cannot: whether the portable
      # bundle brought everything it needs. A "not found" line here is a
      # broken package even though every earlier step was green.
      - name: Resolve shared library dependencies (ldd)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for so in "$LOGOS_MODULES_DIR/lez_faucet/lez_faucet_plugin.so" \
                    "$LOGOS_UI_PLUGINS_DIR/lez_faucet_ui/lez_faucet_ui_plugin.so"; do
            echo "::group::ldd $(basename "$so")"
            # Run from the containing directory: these bundles resolve their
            # siblings through an $ORIGIN rpath, so ldd has to see the .so
            # where it was installed, not where the job happens to be.
            ( cd "$(dirname "$so")" && ldd "./$(basename "$so")" ) | tee /tmp/ldd.txt
            echo "::endgroup::"
            if grep -q 'not found' /tmp/ldd.txt; then
              echo "::error::unresolved dependencies for $(basename "$so"):"
              grep 'not found' /tmp/ldd.txt
              fail=1
            fi
          done
          exit $fail

      - name: dlopen the plugins
        shell: bash
        run: |
          set -euo pipefail
          cc -O0 -Wall -Wextra -Werror -o "$RUNNER_TEMP/dlopen-check" scripts/dlopen-check.c
          "$RUNNER_TEMP/dlopen-check" "$LOGOS_MODULES_DIR/lez_faucet/lez_faucet_plugin.so"
          "$RUNNER_TEMP/dlopen-check" "$LOGOS_UI_PLUGINS_DIR/lez_faucet_ui/lez_faucet_ui_plugin.so"

      # The real host. logoscore scans the same directory lgpm installed
      # into, resolves the module through logos-liblogos, applies the
      # protocol-version gate and hands the file to QPluginLoader — the whole
      # sequence Basecamp performs, minus the window.
      - name: Load lez_faucet in the module host
        id: host
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/logoscore.log"
          # A private config directory, so the daemon cannot pick up state
          # from anywhere else on the runner and a client command cannot
          # reach a daemon this step did not start. logoscore reads this
          # variable for both roles, so it does not have to be repeated as a
          # flag on every call.
          export LOGOSCORE_CONFIG_DIR="$RUNNER_TEMP/logoscore-home"

          logoscore -D -m "$LOGOS_MODULES_DIR" > "$log" 2>&1 &

          # Poll rather than sleep: startup cost differs between the two
          # runner classes, and a fixed sleep is either flaky or slow.
          for _ in $(seq 1 60); do
            if logoscore status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! logoscore status; then
            echo "::error::logoscore daemon did not come up"
            cat "$log"
            exit 1
          fi

          echo "::group::modules the host discovered"
          logoscore list-modules
          echo "::endgroup::"

          echo "--- loading lez_faucet"
          logoscore load-module lez_faucet

          # `load-module` exiting 0 is the assertion. This is the evidence a
          # reader wants beside it: the interface the host can now see, which
          # only exists if the plugin was instantiated rather than merely
          # mapped.
          echo "::group::module-info lez_faucet"
          logoscore module-info lez_faucet
          echo "::endgroup::"

          logoscore unload-module lez_faucet || true
          logoscore stop || true

          # Printed unconditionally, not just on failure. The protocol-version
          # gate and the plugin loader both report here, and a green run whose
          # log is full of warnings is worth seeing.
          echo "::group::daemon log"
          cat "$log"
          echo "::endgroup::"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            echo "### Linux install and load — ${{ matrix.variant }}"
            echo
            echo "- runner: \`${{ matrix.runs-on }}\` (${{ matrix.arch }})"
            echo "- installed with: \`lgpm ${LGPM_VERSION}\`"
            echo "- loaded with: \`logoscore ${LOGOSCORE_VERSION}\` (logos-liblogos, same host library as Basecamp)"
            echo "- result: **${{ steps.host.outcome == 'success' && 'lez_faucet loaded' || 'did not load — see the log above' }}**"
            echo
            echo "Headless. No GUI, no QML view, no faucet method called."
          } >> "$GITHUB_STEP_SUMMARY"
